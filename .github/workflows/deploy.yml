name: CI/CD Deploy to K3s

on:
  push:
    branches:
      - deploy/version

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate image tag
        run: |
          VERSION=$(python - <<EOF
          import tomllib
          with open("pyproject.toml","rb") as f:
              print(tomllib.load(f)["project"]["version"])
          EOF
          )
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=${VERSION}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          IMAGE=ghcr.io/asist525/gangwon-gunwon:${IMAGE_TAG}
          docker buildx build \
            --platform linux/amd64 \
            -t $IMAGE \
            --push .

      # 🔑 SSH 키 복원 (base64 → pem 파일)
      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ec2_key.pem
          chmod 600 ec2_key.pem

      - name: Deploy to EC2 (K3s)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: ec2_key.pem
          script: |
            set -e
            cd ~/upstage_2-3
            sed -i "s|image: .*|image: ghcr.io/asist525/gangwon-gunwon:${IMAGE_TAG}|" infra/k8s/application/04-backend.yaml
            kubectl apply -f infra/k8s/application/04-backend.yaml
